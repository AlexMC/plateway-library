# The required `check` for every pull request (Plateway KTD10): the same checks Plateway runs before Alex's quick look.
# The checker comes from the base branch, so a pull request cannot change the rules it is checked by. The job reads the
# repository only: no secrets, no write permission, and the checkout keeps no token.
name: check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the base branch (the checker)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the pull request (the items)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the checker's dependencies
        run: python -m pip install --disable-pip-version-check -r base/requirements.txt
      - name: Check the changed items
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python base/check_items.py --root pr "$BASE_SHA"
